name: Build VectorCraft MCP (Windows)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "feat/mcp-streamable-http"
  push:
    branches:
      - main
      - feat/mcp-streamable-http
    paths:
      - "crates/**"
      - "apps/vectorcraft-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build Full VectorCraft MCP Studio
        run: cargo build --locked --release -p vectorcraft-cli

      - name: Upload Windows MCP Binary
        uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-mcp-windows
          path: target/release/vectorcraft-cli.exe
          retention-days: 30
