name: Deploy Web to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Cloudflare Pages project name"
        required: false
        default: "the-allcraft"
      branch:
        description: "Branch to build and deploy"
        required: false
        default: "main"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "apps/vectorcraft-web/**"
      - "assets/**"
      - "packaging/web/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Wasm & Deploy to the-allcraft.pages.dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Install Rust stable with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install Trunk bundler
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.cargo/bin" || cargo install trunk --locked
          trunk --version

      - name: Build Web App (Release Wasm)
        working-directory: apps/vectorcraft-web
        run: trunk build --release

      - name: Prepare & validate Cloudflare Pages bundle
        run: |
          test -f dist/web/index.html
          if grep -Eq '(src|href)="/[^/]' dist/web/index.html; then
            echo "Error: dist/web/index.html contains root-absolute URLs" >&2
            exit 1
          fi
          cp packaging/web/_headers dist/web/_headers
          cp packaging/web/README.md dist/web/HOSTING.md

          OVERSIZED=$(find dist/web -type f -size +25M)
          if [ -n "$OVERSIZED" ]; then
            echo "Error: File exceeds Cloudflare 25 MiB single-asset limit: $OVERSIZED" >&2
            exit 1
          fi

          echo "Bundle contents ready in dist/web:"
          ls -lh dist/web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-allcraft-web-cloudflare
          path: dist/web
          retention-days: 14

      - name: Setup Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.project_name || vars.CLOUDFLARE_PROJECT_NAME || 'the-allcraft' }}
          DEPLOY_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set yet. Skipping live deploy (artifact uploaded)."
            {
              echo "### ⚠️ Cloudflare Secrets Needed for Live Deployment"
              echo "Wasm bundle built cleanly and uploaded as **the-allcraft-web-cloudflare** artifact."
              echo ""
              echo "Add these two Repository Secrets in **Settings -> Secrets and variables -> Actions**:"
              echo "- \`CLOUDFLARE_API_TOKEN\` (Token with **Account -> Cloudflare Pages -> Edit** permission)"
              echo "- \`CLOUDFLARE_ACCOUNT_ID\` (Your 32-character Cloudflare Account ID)"
              echo ""
              echo "After adding them, click **Re-run all jobs** or run this workflow manually."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main || true
          npx --yes wrangler@4 pages deploy dist/web \
            --project-name="$PROJECT_NAME" \
            --branch="$DEPLOY_BRANCH" \
            --commit-dirty=true
